name: Publish HH environment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:calendar
      - run: npm run test:database
      - run: npm run test:invitations
      - run: node scripts/check-event-guests.mjs
      - run: npm run test:recovery
      - run: npm run test:welcome
      - run: npm run test:staging
      - run: npm run test:feedback
      - run: npm run test:polish
      - run: node scripts/check-offline-shopping.mjs
      - run: node scripts/check-portal-search.mjs
      - name: Check repository target
        run: test "$GITHUB_REPOSITORY" = "zethhummel-rgb/hummel-home" || test "$GITHUB_REPOSITORY" = "zethhummel-rgb/hh-family"
      - run: npm run build
        env:
          VITE_APP_ENV: ${{ github.repository == 'zethhummel-rgb/hummel-home' && 'test' || 'production' }}
          VITE_SUPABASE_URL: ${{ github.repository == 'zethhummel-rgb/hummel-home' && 'https://ybizqfghnplcxlmlhvyn.supabase.co' || 'https://njpdqiwrwgoothkstoql.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ github.repository == 'zethhummel-rgb/hummel-home' && 'sb_publishable_jbLSo5LPkS9k06Fx1txlBQ_3rWWkWh_' || 'sb_publishable_Ok3ZhlQo6hYLRWcl68Z_Zw_qKEauTkq' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
